name: Release

on:
  workflow_dispatch:

jobs:
  build-test-gate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -q
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t cardsense-backend:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t cardsense-worker:${{ github.sha }} .
      - name: Run acceptance gate
        run: |
          python scripts/acceptance_gate.py tests/fixtures/metrics_pass.json
