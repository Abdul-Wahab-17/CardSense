services:
  redis:
    image: redis:7.4-alpine
    container_name: cardsense-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cardsense-backend
    env_file:
      - .env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      FRAME_STREAM: frames
      DETECTION_STREAM: detections
      BACKEND_CONSUMER_GROUP: backend_broadcaster
      BACKEND_CONSUMER_NAME: backend-1
      STATIC_DIR: frontend
      HAND_SIZE: 13
      MIN_CARD_CONF: 0.02
      HAND_MEMORY_EVENTS: 400
      MIN_CARD_VOTES: 1
    depends_on:
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      FRAME_STREAM: frames
      DETECTION_STREAM: detections
      FRAME_CONSUMER_GROUP: yolo_workers
      WORKER_NAME: worker-${HOSTNAME:-local}
      WORKER_PROCESSES: 1
      YOLO_MODEL: /app/models/playing_cards_best.pt
      YOLO_MODEL_URL: https://raw.githubusercontent.com/noorkhokhar99/Playing-Cards-Detection-with-YoloV8/main/yolov8s_playing_cards.pt
      MODEL_CACHE_DIR: /tmp/cardsense-models
      CONF_THRES: 0.02
      DEBUG_CONF: 0.001
      MAX_FRAME_AGE_MS: 1500
      SLOW_ACCURATE_MODE: 1
      MAX_QUEUE_LEN: 5000
    volumes:
      - ./models:/app/models
    depends_on:
      - redis
