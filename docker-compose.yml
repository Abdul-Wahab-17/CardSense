services:
  redis:
    image: redis:7.4-alpine
    container_name: cardsense-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cardsense-backend
    env_file:
      - .env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      FRAME_STREAM: frames
      DETECTION_STREAM: detections
      BACKEND_CONSUMER_GROUP: backend_broadcaster
      BACKEND_CONSUMER_NAME: backend-1
      STATIC_DIR: frontend
    depends_on:
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      FRAME_STREAM: frames
      DETECTION_STREAM: detections
      FRAME_CONSUMER_GROUP: yolo_workers
      WORKER_NAME: worker-${HOSTNAME}
      YOLO_MODEL: yolov8n.pt
      CONF_THRES: 0.25
      MAX_QUEUE_LEN: 5000
    depends_on:
      - redis
