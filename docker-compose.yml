services:
  redis:
    image: redis:7.4-alpine
    container_name: cardsense-redis
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    container_name: cardsense-db
    environment:
      POSTGRES_DB: cardsense
      POSTGRES_USER: cardsense
      POSTGRES_PASSWORD: cardsense
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  api-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cardsense-api
    env_file:
      - .env
    environment:
      APP_ROLE: ${APP_ROLE:-all}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-}
      STATIC_DIR: frontend
    depends_on:
      - redis
      - db
    ports:
      - "8000:8000"

  reducer-service:
    profiles: ["split-reducer"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cardsense-reducer
    env_file:
      - .env
    environment:
      APP_ROLE: reducer
      REDIS_URL: redis://redis:6379/0
      FRAME_STREAM: frames
      DETECTION_STREAM: detections
      BACKEND_CONSUMER_GROUP: backend_broadcaster
      BACKEND_CONSUMER_NAME: backend-1
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      - redis
      - db

  worker-service:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      FRAME_STREAM: frames
      DETECTION_STREAM: detections
      FRAME_CONSUMER_GROUP: yolo_workers
      WORKER_NAME: worker-${HOSTNAME:-local}
      WORKER_PROCESSES: ${WORKER_PROCESSES:-1}
      YOLO_MODEL: ${YOLO_MODEL:-playing-cards-auto.pt}
      YOLO_MODEL_URL: ${YOLO_MODEL_URL:-}
      MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/tmp/cardsense-models}
      CONF_THRES: ${CONF_THRES:-0.03}
      DEBUG_CONF: ${DEBUG_CONF:-0.001}
      MAX_FRAME_AGE_MS: ${MAX_FRAME_AGE_MS:-1500}
      SLOW_ACCURATE_MODE: ${SLOW_ACCURATE_MODE:-1}
      MAX_QUEUE_LEN: ${MAX_QUEUE_LEN:-5000}
      WORKER_LOG_STREAM: ${WORKER_LOG_STREAM:-worker_logs}
      WORKER_STATUS_PREFIX: ${WORKER_STATUS_PREFIX:-worker:status}
      WORKER_HEARTBEAT_SEC: ${WORKER_HEARTBEAT_SEC:-5}
      MODEL_SMOKE_TEST_URLS: ${MODEL_SMOKE_TEST_URLS:-}
      MODEL_SMOKE_MIN_DETECTIONS: ${MODEL_SMOKE_MIN_DETECTIONS:-1}
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - ./models:/app/models
    depends_on:
      - redis
      - db

  frontend-service:
    image: nginx:1.27-alpine
    container_name: cardsense-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
