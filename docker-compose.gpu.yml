# NVIDIA GPU override for the YOLO workers:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# Needs the NVIDIA Container Toolkit.
services:
  worker-service:
    build:
      args:
        TORCH_VARIANT: cu128
    gpus: all
    environment:
      YOLO_DEVICE: ${YOLO_DEVICE:-0}
